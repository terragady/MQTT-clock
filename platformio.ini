; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

; The firmware persists settings with LittleFS (see MQTTManager::loadSettings).
; Without this the espressif8266 platform defaults to SPIFFS, so `-t uploadfs`
; would build and flash an image the firmware cannot read.
board_build.filesystem = littlefs

build_flags =
    -DNDEBUG
    ; Uncomment to get verbose ESP8266 core debug output on the serial port.
    ; Left off by default: it is noisy, costs flash, and contradicts -DNDEBUG.
    ; -DDEBUG_ESP_PORT=Serial

; Versions are pinned so a rebuild months from now produces the same binary.
; ESP8266mDNS, ArduinoOTA, ESP8266WebServer and ESP8266HTTPUpdateServer are
; bundled with the Arduino core and are resolved automatically - listing them
; here only made PlatformIO search the registry for them.
lib_deps =
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit GFX Library@^1.12.6
	bblanchon/ArduinoJson@^7.4.3
	knolleary/PubSubClient@^2.8

; Over-the-air upload target. Build/upload with: pio run -e d1_mini_ota -t upload
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = ZegarTV.local
upload_flags = --auth=mqtt-clock-ota

; Host-side unit tests for the hardware-independent logic. Run with:
;   pio test -e native
; Only TimeOfDay.cpp is compiled here; everything else in src/ needs the
; Arduino framework and cannot build natively.
[env:native]
platform = native
test_framework = unity
; PlatformIO excludes src/ from test builds unless this is set, so without it
; the tests compile but fail to link.
test_build_src = yes
build_src_filter = +<TimeOfDay.cpp>
build_flags =
    -std=gnu++17
    -I src
